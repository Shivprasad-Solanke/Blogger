<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Post</title>
    <link rel="stylesheet" href="/static/css/update.css">
</head>
<body>
    <div id="navbar"></div>
    <script src="/static/js/shared/navbar.js" defer></script>

    <div id="update-container">
        <h2>Edit Post</h2>
        <form id="update-form">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" rows="10" required></textarea>
            </div>
            <div class="form-group">
                <label for="tags">Enter the new tags (comma separated)</label>
                <input type="text" id="tags" name="tags" placeholder="e.g., nature, plants, gardening" required>
            </div>
            <button type="submit">Update Post</button>
        </form>
        <p id="error-message" style="color:red; display:none;">Error: Unable to update post. Please try again.</p>
    </div>

    <div id="footer"></div>
    

    <script src="/static/js/update.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
