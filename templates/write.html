<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Blog - Medium Style</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;1,300;1,400&family=Roboto+Serif:wght@400;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/write.css">
</head>
<body>
    <!-- Navbar -->
    <div id="navbar"></div>
    <script src="/static/js/shared/navbar.js" defer></script>

    <main>
        <div class="editor-container">
            <h1 class="roboto-serif-heading">Create Your Blog Post</h1>
            <form id="blogForm">
                <div class="editor">
                    <!-- Title Input -->
                    <input
                        type="text"
                        id="blogTitle"
                        name="title"
                        class="merriweather-input"
                        placeholder="Enter your blog title"
                        required
                    />

                    <!-- Content Textarea -->
                    <textarea
                        id="blogContent"
                        name="content"
                        class="merriweather-input"
                        placeholder="Write your blog content here..."
                        required
                        rows="10"
                    ></textarea>

                    <!-- Tags Input -->
                    <input
                        type="text"
                        id="blogTags"
                        name="tags"
                        class="merriweather-input"
                        placeholder="Enter tags, separated by commas"
                        required
                    />

                    <!-- Preview and Publish Buttons -->
                    <div class="editor-buttons">
                        <button type="button" id="previewBtn">Preview</button>
                        <button type="submit" id="publishBtn">Publish</button>
                    </div>
                </div>
            </form>

            <!-- Blog Preview -->
            <h2 class="roboto-serif-subheading">Blog Preview</h2>
            <div id="preview" class="preview">
                <div class="text">
                    <h3 id="previewTitle" class="roboto-serif-heading"></h3>
                    <p id="previewContent" class="merriweather-text"></p>
                    <p id="previewTags" class="merriweather-text"></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>
    <script src="/static/js/shared/footer.js" defer></script>
    <script src="/static/js/write.js" defer></script>
</body>
</html>
