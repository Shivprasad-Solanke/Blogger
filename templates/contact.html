<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - BLOGGER</title>
    <link rel="stylesheet" href="/static/css/contact.css">
    <link rel="stylesheet" href="/static/css/shared/footer.css">
</head>

<body>

    <!-- Header (optional) -->
    <div id="navbar"></div>
    <script src="/static/js/shared/navbar.js" defer></script>

    <!-- Main Contact Section -->
    <section class="contact-section">
        <div class="contact-container">
            <h1>Contact Us</h1>
            <p>If you have any questions or feedback, feel free to reach out to us. We'd love to hear from you!</p>

            <form id="contact-form" action="http://127.0.0.1:8000/contact" method="POST" class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Your Full Name">
            
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Your Email Address">
            
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required placeholder="Your Message"></textarea>
            
                <button type="submit">Send Message</button>
            </form>
            
            <!-- Contact Information -->
            <div class="contact-info">
                <h2>Contact Information</h2>
                <p>Email: <a href="mailto:gorterushi25@gmail.com">blogger@gmail.com</a></p>
                <p>Phone: +91 9356679894</p>
                <p>Address: 1 Tech Titans, Latur, Maharashtra, India</p>
            </div>
        </div>
    </section>
