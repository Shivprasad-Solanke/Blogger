version: '3.8'

services:
  app:
    build: .
    container_name: blogger_app
    ports:
      - "80:80"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017
    volumes:
      - ./app:/app
      - ./config/nginx.conf:/etc/nginx/nginx.conf

  mongo:
    image: mongo:latest
    container_name: blogger_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
